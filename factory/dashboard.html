<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software factory</title>
<!-- devolps software factory board (FA-09.2). Reads board.json, which `devolps factory board` writes.
     Serve it from the repository: python3 -m http.server 8765 --directory factory, then open http://localhost:8765/dashboard.html -->
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --ink: #1c1c1e; --muted: #6b6b70; --line: #e4e2dd;
    --pass: #1f7a4d; --pass-bg: #e2f2e9; --changes: #9a5b00; --changes-bg: #fcefd6;
    --pending: #8a8a90; --pending-bg: #efefee; --invalid: #b42318; --invalid-bg: #fde7e4;
    --you: #3646c4; --you-bg: #e8ebfc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131315; --surface: #1c1c1f; --ink: #ececee; --muted: #a0a0a8; --line: #2d2d33;
      --pass: #6fd3a0; --pass-bg: #163226; --changes: #f2c66b; --changes-bg: #3a2d12;
      --pending: #8a8a92; --pending-bg: #26262b; --invalid: #ff8a7a; --invalid-bg: #3d1a16;
      --you: #a5b1ff; --you-bg: #1f2547;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 18px 20px 6px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }
  .strip { margin: 10px 20px; padding: 10px 12px; border: 1px solid var(--you); background: var(--you-bg); border-radius: 10px; }
  .strip h2 { font-size: 13px; margin: 0 0 8px; color: var(--you); text-transform: uppercase; letter-spacing: .04em; }
  .strip .cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 1fr); gap: 10px; padding: 10px 20px 24px; overflow-x: auto; }
  .col { background: transparent; min-height: 120px; }
  .col h3 { font-size: 12px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; width: 100%; text-align: left; font: inherit; color: inherit; }
  .strip .card { width: 260px; }
  .card:hover { border-color: var(--muted); }
  .card.you { border: 2px solid var(--you); }
  .card .id { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .card .title { font-weight: 600; margin: 2px 0 6px; }
  .card .reason { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--you-bg); color: var(--you); margin-left: 4px; }
  .round { display: flex; gap: 4px; align-items: center; margin-top: 4px; }
  .round .n { font-size: 11px; color: var(--muted); width: 20px; }
  .chip { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; }
  .PASS { color: var(--pass); background: var(--pass-bg); }
  .CHANGES { color: var(--changes); background: var(--changes-bg); }
  .pending { color: var(--pending); background: var(--pending-bg); }
  .invalid { color: var(--invalid); background: var(--invalid-bg); }
  .APPROVE { color: var(--pass); background: var(--pass-bg); }
  .ESCALATE { color: var(--invalid); background: var(--invalid-bg); }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); display: none; flex-direction: column; }
  aside.open { display: flex; }
  aside header { border-bottom: 1px solid var(--line); padding: 12px 16px; justify-content: space-between; }
  aside nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  aside nav button, .close { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  aside nav button.on { border-color: var(--you); color: var(--you); }
  aside article { padding: 14px 18px 40px; overflow: auto; }
  article pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px; }
  article code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  article table { border-collapse: collapse; } article td, article th { border: 1px solid var(--line); padding: 4px 6px; }
  .empty { padding: 40px 20px; color: var(--muted); }
  @media (max-width: 700px) { .board { grid-auto-flow: row; grid-auto-columns: auto; } .strip .card { width: 100%; } }
</style>
</head>
<body>
<header><h1>Software factory</h1><span class="tag" id="auto" hidden></span><span class="muted" id="when">Loading board.json…</span></header>
<section class="strip" id="you" hidden><h2>Needs you</h2><div class="cards" id="you-cards"></div></section>
<main class="board" id="board"></main>
<aside id="drawer" aria-label="Job files">
  <header><div><div class="id" id="d-id"></div><strong id="d-title"></strong></div><button class="close" id="close">Close</button></header>
  <nav id="d-files"></nav>
  <article id="d-body"></article>
</aside>
<script>
const COLUMNS = [
  ["spec", "Spec"], ["go", "Your go"], ["build", "Build"], ["rework", "Rework"], ["review", "Review"],
  ["verify", "QA and CI"], ["approve", "Approve"], ["merge", "Merge"], ["needs-human", "Needs you"], ["merged", "Merged"],
];
const LABEL = { security: "Sec", code: "Code", ux: "UX", ui: "UI" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let board = { jobs: [] };
let openJob = null;

const chips = (job) => job.rounds.map((r) => `<div class="round"><span class="n">R${r.n}</span>${
  Object.keys(LABEL).map((k) => `<span class="chip ${r.reviews[k]}" title="${k}: ${r.reviews[k]}">${LABEL[k]}</span>`).join("")
}${r.verify !== "pending" || r.n === job.round ? `<span class="chip ${r.verify}" title="verify: ${r.verify}">QA</span>` : ""}${r.ci !== "pending" || r.n === job.round ? `<span class="chip ${r.ci}" title="CI: ${r.ci}">CI</span>` : ""}</div>`).join("");

const card = (job) => `<button class="card${job.needsYou ? " you" : ""}" data-id="${esc(job.id)}">
  <div class="id">${esc(job.id)}${job.needsYou ? '<span class="tag">needs you</span>' : ""}</div>
  <div class="title">${esc(job.title)}</div>
  ${chips(job)}
  ${job.decision !== "pending" ? `<div class="round"><span class="n"></span><span class="chip ${job.decision}">${job.decision}</span></div>` : ""}
  ${job.reason ? `<div class="reason">${esc(job.reason)}</div>` : ""}
</button>`;

function render() {
  const you = board.jobs.filter((j) => j.needsYou);
  document.getElementById("you").hidden = !you.length;
  document.getElementById("you-cards").innerHTML = you.map(card).join("");
  const el = document.getElementById("board");
  if (!board.jobs.length) { el.innerHTML = '<div class="empty">No factory jobs yet. Start one with /devolps:factory &lt;feature&gt;.</div>'; return; }
  el.innerHTML = COLUMNS.map(([stage, name]) => {
    const jobs = board.jobs.filter((j) => j.stage === stage);
    return `<section class="col"><h3><span>${name}</span><span>${jobs.length || ""}</span></h3>${jobs.map(card).join("")}</section>`;
  }).join("");
}

// A small markdown view: headings, lists, tables, code, bold and inline code. Text is escaped first.
function md(src) {
  const lines = esc(src).split("\n");
  let out = "", inCode = false, inList = false, table = [];
  const inline = (t) => t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter((r) => !/^\|[\s|:-]+\|$/.test(r)).map((r) => r.replace(/^\||\|$/g, "").split("|"));
    out += "<table>" + rows.map((r, i) => `<tr>${r.map((c) => `<${i ? "td" : "th"}>${inline(c.trim())}</${i ? "td" : "th"}>`).join("")}</tr>`).join("") + "</table>";
    table = [];
  };
  for (const line of lines) {
    if (line.startsWith("```")) { flushTable(); out += inCode ? "</code></pre>" : "<pre><code>"; inCode = !inCode; continue; }
    if (inCode) { out += line + "\n"; continue; }
    if (/^\|.*\|$/.test(line.trim())) { table.push(line.trim()); continue; }
    flushTable();
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    const li = /^\s*(?:[-*]|\d+\.)\s+(.*)$/.exec(line);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (h) out += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  flushTable();
  return out + (inList ? "</ul>" : "") + (inCode ? "</code></pre>" : "");
}

async function showFile(job, file) {
  document.querySelectorAll("#d-files button").forEach((b) => b.classList.toggle("on", b.dataset.file === file));
  const body = document.getElementById("d-body");
  try {
    const r = await fetch(`jobs/${encodeURIComponent(job.id)}/${file.split("/").map(encodeURIComponent).join("/")}`, { cache: "no-store" });
    body.innerHTML = r.ok ? md(await r.text()) : `<p class="muted">Could not read ${esc(file)}.</p>`;
  } catch { body.innerHTML = `<p class="muted">Could not read ${esc(file)}.</p>`; }
}

function openDrawer(id) {
  const job = board.jobs.find((j) => j.id === id);
  if (!job) return;
  openJob = id;
  document.getElementById("d-id").textContent = `${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ""}`;
  document.getElementById("d-title").textContent = job.title;
  document.getElementById("d-files").innerHTML = job.files.map((f) => `<button data-file="${esc(f)}">${esc(f)}</button>`).join("") || '<span class="muted">No files yet.</span>';
  document.getElementById("drawer").classList.add("open");
  if (job.files.length) showFile(job, job.files[job.files.length - 1]);
}

document.addEventListener("click", (e) => {
  const c = e.target.closest(".card");
  if (c) return openDrawer(c.dataset.id);
  const f = e.target.closest("#d-files button");
  if (f && openJob) return showFile(board.jobs.find((j) => j.id === openJob), f.dataset.file);
});
document.getElementById("close").onclick = () => { document.getElementById("drawer").classList.remove("open"); openJob = null; };

async function poll() {
  try {
    const r = await fetch("board.json", { cache: "no-store" });
    if (r.ok) {
      board = await r.json();
      document.getElementById("when").textContent = `${board.jobs.length} job(s) · updated ${new Date(board.generatedAt).toLocaleTimeString()}`;
      const auto = document.getElementById("auto");
      auto.hidden = false;
      auto.textContent = board.auto ? "Auto mode on" : "Auto mode off";
      auto.title = board.auto ? "An approved job merges without you. Type /devolps:factory auto off to stop it." : "Each merge waits for /devolps:factory approve <job>.";
      render();
    } else document.getElementById("when").textContent = "No board.json yet: run devolps factory board.";
  } catch { document.getElementById("when").textContent = "Serve this page with python3 -m http.server 8765 --directory factory."; }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
